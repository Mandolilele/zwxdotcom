<script>
    var  winWidth = document.documentElement.clientWidth;
    if(winWidth>414) {
        /*轮播图配置*/
        $('.slider').slick({
            lazyLoad: 'ondemand',
            slidesToShow: 1,
            slidesToScroll: 1,
            speed: 500
        });
    }else {
        $('.slider').slick({
            lazyLoad: 'progressive',
            slidesToShow: 1,
            slidesToScroll: 1,
            speed: 500
        });
    }

    $(function(){
        var  windowH = parseInt($(window).height());
        $("#portfolioDel").height(windowH);

        var len=parseInt($(".allItem").text());
        $(".allItem").text(len);
        $(".slick-next").click(function(){
            var nowVal=parseInt($(".nowItem").text())+1;
            if(nowVal-len<=0){
                $(".nowItem").text(nowVal);
            }else{
                $(".nowItem").text(1);
            }
        });
        $(".slick-prev").click(function(){
            var nowVal=parseInt($(".nowItem").text())-1;
            if(nowVal==0){
                $(".nowItem").text(len);
            }else{
                $(".nowItem").text(nowVal);
            }
        });

        $(".lazy").on("swipe",function(){
            var liHeight=$(".slick-current").height();
            $(".slick-track").css({
                "max-height":liHeight,
                "overflow":"hidden"
            });
        })
    })




</script>
